<section class="site-section site-contact">
	<span class="site-kicker">Contact</span>
	<h2>{{ data['title'] || 'Let’s work together' }}</h2>
	<p>{{ data['description'] || 'Have a project in mind? I would love to hear about it.' }}</p>
	<a [href]="'mailto:' + (data['email'] || 'hello@example.com')">{{ data['email'] || 'hello@example.com' }}</a>
</section>
